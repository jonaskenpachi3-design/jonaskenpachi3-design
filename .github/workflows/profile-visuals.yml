name: Update profile contribution graphic

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update contribution SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/render_profile.py
      - name: Commit updated graphic
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "No contribution changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: update monthly contribution graphic"
          git push
