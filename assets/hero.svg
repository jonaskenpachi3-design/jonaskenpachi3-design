<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d"><title id="t">Jonas | Desenvolvedor</title><desc id="d">Apresentação profissional de Jonas.</desc><rect x="2" y="2" width="1196" height="246" rx="16" fill="#171e24" stroke="#344149" stroke-width="2"/><path d="M48 42V208" stroke="#8fb5a6" stroke-width="3" stroke-linecap="round"/><text x="78" y="65" fill="#9fb4aa" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">DESENVOLVIMENTO · TECNOLOGIA · CRIATIVIDADE</text><text x="76" y="137" fill="#e5ebe7" font-family="Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6">Olá, eu sou Jonas.</text><rect x="78" y="155" width="82" height="4" rx="2" fill="#8fb5a6"/><text x="78" y="192" fill="#c0cbc5" font-family="Arial,sans-serif" font-size="19">Desenvolvedor em evolução, criando soluções digitais</text><text x="78" y="218" fill="#c0cbc5" font-family="Arial,sans-serif" font-size="19">com atenção aos detalhes e foco na experiência.</text><rect x="880" y="66" width="250" height="126" rx="11" fill="#202a31" stroke="#3a4a50"/><path d="M880 98H1130" stroke="#3a4a50"/><circle cx="899" cy="82" r="4" fill="#71877d"/><circle cx="914" cy="82" r="4" fill="#71877d"/><circle cx="929" cy="82" r="4" fill="#71877d"/><text x="900" y="125" fill="#9fb4aa" font-family="monospace" font-size="12">const direction =</text><text x="900" y="151" fill="#a9cbbd" font-family="monospace" font-size="15">"build with purpose";</text><text x="900" y="174" fill="#8b9b93" font-family="monospace" font-size="11">// always improving</text></svg>