<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d">
<title id="t">Jonas | Desenvolvedor web</title><desc id="d">Apresentação minimalista de Jonas com estética editorial escura.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1018"/><stop offset="1" stop-color="#111c2a"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".045"/></pattern>
</defs>
<style>
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
.a{opacity:0;animation:enter .7s ease-out forwards}.b{animation-delay:.16s}.c{animation-delay:.3s}.accent{animation:glow 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect x="2" y="2" width="1196" height="306" rx="18" fill="url(#bg)" stroke="#29384b" stroke-width="1.5"/>
<rect x="3" y="3" width="1194" height="304" rx="17" fill="url(#grid)"/>
<path d="M50 55V255" stroke="#334155" stroke-width="2"/>
<path d="M50 55V255" stroke="url(#line)" stroke-width="2.5" class="accent"/>
<g class="a"><text x="82" y="74" fill="#8fa3b8" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">DESENVOLVIMENTO • TECNOLOGIA • CRIATIVIDADE</text></g>
<g class="a b"><text x="80" y="151" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">Olá, eu sou Jonas.</text><rect x="82" y="171" width="104" height="4" rx="2" fill="url(#line)"/></g>
<g class="a c"><text x="82" y="214" fill="#c0ccda" font-family="Arial,sans-serif" font-size="20">Desenvolvedor em evolução, criando soluções digitais</text><text x="82" y="243" fill="#c0ccda" font-family="Arial,sans-serif" font-size="20">com atenção aos detalhes e foco na experiência.</text></g>
<g transform="translate(880 82)"><rect width="250" height="146" rx="12" fill="#0c1420" stroke="#2b3a4e"/><path d="M0 34H250" stroke="#2b3a4e"/><circle cx="19" cy="17" r="4" fill="#64748b"/><circle cx="34" cy="17" r="4" fill="#64748b"/><circle cx="49" cy="17" r="4" fill="#64748b"/><text x="20" y="66" fill="#8b9db2" font-family="monospace" font-size="12">const direction =</text><text x="20" y="91" fill="#67e8f9" font-family="monospace" font-size="15">"build with purpose";</text><text x="20" y="121" fill="#7c8da3" font-family="monospace" font-size="11">// always improving</text></g>
<text x="82" y="282" fill="#71839a" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">PORTFÓLIO PESSOAL</text>
</svg>