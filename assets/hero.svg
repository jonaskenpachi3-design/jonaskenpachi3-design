<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
<title id="t">Jonas | Desenvolvedor</title>
<desc id="d">Apresentação animada em azul-petróleo e verde-água: Olá, eu sou Jonas.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1922"/><stop offset="1" stop-color="#172832"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ee7c8"/><stop offset="1" stop-color="#67b9d0"/></linearGradient>
  <radialGradient id="glowA"><stop stop-color="#6ee7c8" stop-opacity=".22"/><stop offset="1" stop-color="#6ee7c8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop stop-color="#67b9d0" stop-opacity=".26"/><stop offset="1" stop-color="#67b9d0" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6ee7c8" opacity=".13"/></pattern>
  <clipPath id="card"><rect x="2" y="2" width="1196" height="276" rx="20"/></clipPath>
</defs>
<style>
  .f{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  .fb{transform-box:fill-box}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes title{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(60px,24px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,-18px)}}
  @keyframes sweep{0%{transform:translateX(0) skewX(-18deg)}45%,100%{transform:translateX(1700px) skewX(-18deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes chart{0%{stroke-dashoffset:1;opacity:1}38%{stroke-dashoffset:0}86%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes dotEnd{0%,34%{opacity:0;transform:scale(.2)}42%{opacity:1;transform:scale(1.25)}48%{transform:scale(1)}86%{opacity:1}100%{opacity:0}}
  @keyframes ripple{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-6px)}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .bar{transform-origin:50% 0;animation:bar 1s cubic-bezier(.2,.7,.2,1) .1s both}
  .grow{transform-origin:0 50%;animation:grow 1s cubic-bezier(.2,.7,.2,1) .9s both}
  .o1{animation:drift1 14s ease-in-out infinite alternate}
  .o2{animation:drift2 16s ease-in-out infinite alternate}
  .sheen{animation:sweep 9s ease-in-out 2s infinite}
  .ringA{transform-origin:1000px 140px;animation:spin 40s linear infinite}
  .ringB{transform-origin:1000px 140px;animation:spinr 60s linear infinite}
  .chart{stroke-dasharray:1;animation:chart 7s ease-in-out infinite}
  .dotEnd{transform-origin:center;animation:dotEnd 7s ease-in-out infinite}
  .ripple{transform-origin:center;animation:ripple 2.6s ease-out infinite}
  .float{animation:float 4.5s ease-in-out infinite alternate}
  .glow{animation:glow 3.5s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="2" y="2" width="1196" height="276" rx="20" fill="url(#bg)"/>
<g clip-path="url(#card)">
  <rect width="1200" height="280" fill="url(#dots)"/>
  <circle class="o1" cx="180" cy="40" r="230" fill="url(#glowA)"/>
  <circle class="o2" cx="1010" cy="150" r="270" fill="url(#glowB)"/>
  <rect class="sheen" x="-260" y="-20" width="220" height="320" fill="url(#sheen)"/>
</g>
<rect x="2" y="2" width="1196" height="276" rx="20" fill="none" stroke="#314854" stroke-width="2"/>

<rect class="bar fb" x="46" y="46" width="4" height="186" rx="2" fill="url(#line)"/>

<g class="f">
  <text class="up" style="animation-delay:.2s" x="82" y="70" fill="#8da9ad" font-size="13" font-weight="700" letter-spacing="3">DESENVOLVIMENTO  /  TECNOLOGIA  /  CRIATIVIDADE</text>
  <text style="animation:title 1.1s cubic-bezier(.2,.7,.2,1) .4s both" x="80" y="151" fill="#f1f6f4" font-size="64" font-weight="700" letter-spacing="-2">Olá, eu sou Jonas.</text>
  <rect class="grow fb" x="82" y="171" width="108" height="5" rx="2.5" fill="url(#line)"/>
  <text class="up" style="animation-delay:1s" x="82" y="211" fill="#c0d0d0" font-size="20">Desenvolvedor em evolução, criando soluções digitais</text>
  <text class="up" style="animation-delay:1.2s" x="82" y="240" fill="#c0d0d0" font-size="20">com atenção aos detalhes e foco na experiência.</text>
</g>

<g class="up" style="animation-delay:.6s">
  <g class="float">
    <circle class="ringA" cx="1000" cy="140" r="108" fill="none" stroke="#4a6f73" stroke-width="2" stroke-dasharray="2 13" stroke-linecap="round"/>
    <circle class="ringB" cx="1000" cy="140" r="99" fill="none" stroke="#35525b" stroke-width="1.2" stroke-dasharray="46 20 8 20"/>
    <circle cx="1000" cy="140" r="91" fill="#1b3039" stroke="#35525b" stroke-width="2"/>
    <circle class="glow" cx="1000" cy="140" r="69" fill="none" stroke="#547b7d" stroke-width="1.5"/>
    <path d="M938 188H1062" stroke="#2c474f" stroke-width="1"/>
    <path d="M938 164H1062" stroke="#27414a" stroke-width="1" stroke-dasharray="3 5"/>
    <path class="chart" pathLength="1" d="M952 152L985 119L1010 144L1051 103" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="952" cy="152" r="6" fill="#6ee7c8"/>
    <circle class="ripple" cx="952" cy="152" r="6" fill="none" stroke="#6ee7c8" stroke-width="1.5"/>
    <circle class="dotEnd" cx="1051" cy="103" r="6" fill="#67b9d0"/>
  </g>
</g>
<text class="f up" style="animation-delay:1.4s" x="1000" y="262" text-anchor="middle" fill="#8da9ad" font-size="11" letter-spacing="2">BUILD WITH PURPOSE</text>
</svg>
