<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d"><title id="t">Projetos selecionados</title><desc id="d">Orvix, Nexora e Weatherly em destaque.</desc><text x="8" y="26" fill="#293934" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.8">PROJETOS EM DESTAQUE</text><path d="M8 39H1192" stroke="#dce4e1"/><g font-family="Arial,sans-serif"><rect x="8" y="58" width="378" height="198" rx="14" fill="#fff" stroke="#dce4e1"/><text x="32" y="91" fill="#71847c" font-size="11">01 · INTELIGÊNCIA FINANCEIRA</text><text x="32" y="132" fill="#263630" font-size="25" font-weight="700">Orvix</text><text x="32" y="162" fill="#566760" font-size="14">Plataforma de inteligência financeira</text><text x="32" y="183" fill="#566760" font-size="14">com dashboard, metas e insights.</text><path d="M32 222H90" stroke="#6d9b91" stroke-width="3" stroke-linecap="round"/><text x="32" y="246" fill="#71847c" font-size="11">ANGULAR · NODE.JS · POSTGRESQL</text><rect x="411" y="58" width="378" height="198" rx="14" fill="#fff" stroke="#dce4e1"/><text x="435" y="91" fill="#71847c" font-size="11">02 · PRODUTIVIDADE</text><text x="435" y="132" fill="#263630" font-size="25" font-weight="700">Nexora</text><text x="435" y="162" fill="#566760" font-size="14">Sistema full stack de gerenciamento</text><text x="435" y="183" fill="#566760" font-size="14">de tarefas, prioridades e prazos.</text><path d="M435 222H493" stroke="#6d9b91" stroke-width="3" stroke-linecap="round"/><text x="435" y="246" fill="#71847c" font-size="11">NODE.JS · EXPRESS · POSTGRESQL</text><rect x="814" y="58" width="378" height="198" rx="14" fill="#fff" stroke="#dce4e1"/><text x="838" y="91" fill="#71847c" font-size="11">03 · DADOS &amp; INTERFACE</text><text x="838" y="132" fill="#263630" font-size="25" font-weight="700">Weatherly</text><text x="838" y="162" fill="#566760" font-size="14">Dashboard meteorológico com dados</text><text x="838" y="183" fill="#566760" font-size="14">em tempo real e previsão de 5 dias.</text><path d="M838 222H896" stroke="#6d9b91" stroke-width="3" stroke-linecap="round"/><text x="838" y="246" fill="#71847c" font-size="11">HTML · CSS · JAVASCRIPT</text></g></svg>