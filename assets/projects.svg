<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d">
<title id="t">Projetos selecionados</title><desc id="d">Orvix, Nexora e Weatherly em destaque.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c2a"/><stop offset="1" stop-color="#0d1520"/></linearGradient><linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
<style>@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.p{opacity:0;animation:up .65s ease-out forwards}.p2{animation-delay:.12s}.p3{animation-delay:.24s}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style>
<text x="8" y="26" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">PROJETOS SELECIONADOS</text><path d="M8 37H1192" stroke="#29384b"/>
<g class="p"><rect x="8" y="58" width="378" height="198" rx="14" fill="url(#card)" stroke="#2c4054"/><text x="32" y="91" fill="#6f849c" font-family="monospace" font-size="11">01 / INTELIGÊNCIA FINANCEIRA</text><text x="32" y="131" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Orvix</text><text x="32" y="161" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">Plataforma de inteligência financeira</text><text x="32" y="182" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">com dashboard, metas e insights.</text><path d="M32 222H90" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="32" y="246" fill="#71869d" font-family="Arial,sans-serif" font-size="11">ANGULAR · NODE.JS · POSTGRESQL</text></g>
<g class="p p2"><rect x="411" y="58" width="378" height="198" rx="14" fill="url(#card)" stroke="#2c4054"/><text x="435" y="91" fill="#6f849c" font-family="monospace" font-size="11">02 / PRODUTIVIDADE</text><text x="435" y="131" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Nexora</text><text x="435" y="161" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">Sistema full stack de gerenciamento</text><text x="435" y="182" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">de tarefas, prioridades e prazos.</text><path d="M435 222H493" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="435" y="246" fill="#71869d" font-family="Arial,sans-serif" font-size="11">NODE.JS · EXPRESS · POSTGRESQL</text></g>
<g class="p p3"><rect x="814" y="58" width="378" height="198" rx="14" fill="url(#card)" stroke="#2c4054"/><text x="838" y="91" fill="#6f849c" font-family="monospace" font-size="11">03 / DADOS &amp; INTERFACE</text><text x="838" y="131" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Weatherly</text><text x="838" y="161" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">Dashboard meteorológico com dados</text><text x="838" y="182" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">em tempo real e previsão de 5 dias.</text><path d="M838 222H896" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="838" y="246" fill="#71869d" font-family="Arial,sans-serif" font-size="11">HTML · CSS · JAVASCRIPT</text></g>
</svg>