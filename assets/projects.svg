<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Projetos em destaque</title><desc id="desc">Três cartões de projetos com ícones, descrições e tecnologias.</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c30"/><stop offset="1" stop-color="#0b1425"/></linearGradient><linearGradient id="teal"><stop stop-color="#123c43"/><stop offset="1" stop-color="#17435a"/></linearGradient><linearGradient id="violet"><stop stop-color="#292454"/><stop offset="1" stop-color="#45265f"/></linearGradient><linearGradient id="amber"><stop stop-color="#4b2b25"/><stop offset="1" stop-color="#55351f"/></linearGradient></defs>
<style>@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.card{opacity:0;animation:up .65s ease-out forwards}.c2{animation-delay:.14s}.c3{animation-delay:.28s}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style>
<text x="8" y="34" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1">PROJETOS EM DESTAQUE</text><text x="1190" y="33" text-anchor="end" fill="#71839d" font-family="Arial,sans-serif" font-size="12">IDEIAS • CÓDIGO • RESULTADOS</text>
<g class="card"><rect x="4" y="55" width="382" height="265" rx="20" fill="url(#panel)" stroke="#286d70"/><rect x="5" y="56" width="380" height="105" rx="19" fill="url(#teal)"/><circle cx="194" cy="107" r="35" fill="#0c2833" stroke="#5eead4" stroke-opacity=".65"/><path d="M176 107h36M194 89v36M181 94l26 26M207 94l-26 26" stroke="#8af0dc" stroke-width="3" stroke-linecap="round"/><text x="29" y="199" fill="#f8fafc" font-family="Arial,sans-serif" font-size="23" font-weight="700">Nexora</text><text x="29" y="226" fill="#b7c6d8" font-family="Arial,sans-serif" font-size="14">Gestão inteligente de tarefas</text><text x="29" y="248" fill="#b7c6d8" font-family="Arial,sans-serif" font-size="14">e produtividade.</text><text x="29" y="290" fill="#5eead4" font-family="Arial,sans-serif" font-size="12" font-weight="700">JAVASCRIPT  /  NODE.JS  /  POSTGRESQL</text></g>
<g class="card c2"><rect x="409" y="55" width="382" height="265" rx="20" fill="url(#panel)" stroke="#7770c8"/><rect x="410" y="56" width="380" height="105" rx="19" fill="url(#violet)"/><circle cx="600" cy="107" r="35" fill="#211d43" stroke="#c4b5fd" stroke-opacity=".7"/><circle cx="600" cy="107" r="13" fill="none" stroke="#ddd6fe" stroke-width="3"/><path d="M600 78v9M600 127v9M571 107h9M620 107h9M580 87l7 7M613 120l7 7" stroke="#ddd6fe" stroke-width="3" stroke-linecap="round"/><text x="434" y="199" fill="#f8fafc" font-family="Arial,sans-serif" font-size="23" font-weight="700">Weather Dashboard</text><text x="434" y="226" fill="#b7c6d8" font-family="Arial,sans-serif" font-size="14">Painel responsivo para acompanhar</text><text x="434" y="248" fill="#b7c6d8" font-family="Arial,sans-serif" font-size="14">informações meteorológicas.</text><text x="434" y="290" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="12" font-weight="700">HTML  /  CSS  /  JAVASCRIPT</text></g>
<g class="card c3"><rect x="814" y="55" width="382" height="265" rx="20" fill="url(#panel)" stroke="#b77945"/><rect x="815" y="56" width="380" height="105" rx="19" fill="url(#amber)"/><circle cx="1005" cy="107" r="35" fill="#38241d" stroke="#fdba74" stroke-opacity=".7"/><rect x="984" y="91" width="42" height="31" rx="5" fill="none" stroke="#ffedd5" stroke-width="3"/><path d="M991 101h28M991 110h18M991 117h12" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round"/><text x="839" y="199" fill="#f8fafc" font-family="Arial,sans-serif" font-size="23" font-weight="700">Controle Financeiro</text><text x="839" y="226" fill="#b7c6d8" font-family="Arial,sans-serif" font-size="14">Interface para organizar despesas</text><text x="839" y="248" fill="#b7c6d8" font-family="Arial,sans-serif" font-size="14">e acompanhar finanças pessoais.</text><text x="839" y="290" fill="#fdba74" font-family="Arial,sans-serif" font-size="12" font-weight="700">HTML  /  CSS</text></g>
</svg>