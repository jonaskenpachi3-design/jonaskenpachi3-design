<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-labelledby="t d"><title id="t">Projetos em destaque</title><desc id="d">Orvix, Nexora e Weatherly.</desc><text x="8" y="27" fill="#e0e7e2" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">PROJETOS EM DESTAQUE</text><path d="M8 42H1192" stroke="#344149"/><g font-family="Arial,sans-serif"><rect x="8" y="62" width="378" height="204" rx="13" fill="#1b242b" stroke="#35444b"/><text x="32" y="96" fill="#9fb4aa" font-size="12" letter-spacing=".7">01 / INTELIGÊNCIA FINANCEIRA</text><text x="32" y="139" fill="#e5ebe7" font-size="27" font-weight="700">Orvix</text><text x="32" y="171" fill="#c0cbc5" font-size="16">Plataforma de inteligência financeira</text><text x="32" y="194" fill="#c0cbc5" font-size="16">com dashboard, metas e insights.</text><path d="M32 229H90" stroke="#8fb5a6" stroke-width="3" stroke-linecap="round"/><text x="32" y="253" fill="#9aaba2" font-size="12">ANGULAR · NODE.JS · POSTGRESQL</text><rect x="411" y="62" width="378" height="204" rx="13" fill="#1b242b" stroke="#35444b"/><text x="435" y="96" fill="#9fb4aa" font-size="12" letter-spacing=".7">02 / PRODUTIVIDADE</text><text x="435" y="139" fill="#e5ebe7" font-size="27" font-weight="700">Nexora</text><text x="435" y="171" fill="#c0cbc5" font-size="16">Sistema full stack de gerenciamento</text><text x="435" y="194" fill="#c0cbc5" font-size="16">de tarefas, prioridades e prazos.</text><path d="M435 229H493" stroke="#8fb5a6" stroke-width="3" stroke-linecap="round"/><text x="435" y="253" fill="#9aaba2" font-size="12">NODE.JS · EXPRESS · POSTGRESQL</text><rect x="814" y="62" width="378" height="204" rx="13" fill="#1b242b" stroke="#35444b"/><text x="838" y="96" fill="#9fb4aa" font-size="12" letter-spacing=".7">03 / DADOS &amp; INTERFACE</text><text x="838" y="139" fill="#e5ebe7" font-size="27" font-weight="700">Weatherly</text><text x="838" y="171" fill="#c0cbc5" font-size="1