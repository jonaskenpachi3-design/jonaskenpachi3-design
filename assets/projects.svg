<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Projetos selecionados</title><desc id="d">Três projetos apresentados em cartões minimalistas.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c2a"/><stop offset="1" stop-color="#0d1520"/></linearGradient><linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
<style>@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.p{opacity:0;animation:up .65s ease-out forwards}.p2{animation-delay:.12s}.p3{animation-delay:.24s}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style>
<text x="8" y="31" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">PROJETOS SELECIONADOS</text><path d="M8 47H1192" stroke="#29384b"/>
<g class="p"><rect x="8" y="68" width="378" height="218" rx="14" fill="url(#card)" stroke="#2c4054"/><text x="32" y="103" fill="#6f849c" font-family="monospace" font-size="11">01 / PRODUTIVIDADE</text><text x="32" y="151" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Nexora</text><text x="32" y="181" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">Organização de tarefas e fluxos</text><text x="32" y="202" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">para uma rotina mais eficiente.</text><path d="M32 242H90" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="32" y="266" fill="#71869d" font-family="Arial,sans-serif" font-size="11">JAVASCRIPT · NODE.JS · POSTGRESQL</text></g>
<g class="p p2"><rect x="411" y="68" width="378" height="218" rx="14" fill="url(#card)" stroke="#2c4054"/><text x="435" y="103" fill="#6f849c" font-family="monospace" font-size="11">02 / DADOS &amp; INTERFACE</text><text x="435" y="151" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Weather Dashboard</text><text x="435" y="181" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">Visualização de informações</text><text x="435" y="202" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">meteorológicas em um painel web.</text><path d="M435 242H493" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="435" y="266" fill="#71869d" font-family="Arial,sans-serif" font-size="11">HTML · CSS · JAVASCRIPT</text></g>
<g class="p p3"><rect x="814" y="68" width="378" height="218" rx="14" fill="url(#card)" stroke="#2c4054"/><text x="838" y="103" fill="#6f849c" font-family="monospace" font-size="11">03 / FINANÇAS PESSOAIS</text><text x="838" y="151" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Controle Financeiro</text><text x="838" y="181" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">Interface para acompanhar gastos</text><text x="838" y="202" fill="#aebdce" font-family="Arial,sans-serif" font-size="14">e organizar o orçamento pessoal.</text><path d="M838 242H896" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="838" y="266" fill="#71869d" font-family="Arial,sans-serif" font-size="11">HTML · CSS</text></g>
</svg>