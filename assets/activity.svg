<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-labelledby="t d">
<title id="t">Tecnologias</title>
<desc id="d">JavaScript, HTML, CSS, Angular, Node.js, Express e PostgreSQL.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14232c"/><stop offset="1" stop-color="#112029"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ee7c8"/><stop offset="1" stop-color="#67b9d0"/></linearGradient>
</defs>
<style>
  .f{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .fb{transform-box:fill-box}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes scan{0%{stroke:#3a5660;fill:#1d303a}5%{stroke:#6ee7c8;fill:#223a42}14%,100%{stroke:#3a5660;fill:#1d303a}}
  @keyframes scanBadge{0%{fill-opacity:.12}5%{fill-opacity:.35}14%,100%{fill-opacity:.12}}
  @keyframes underline{0%{transform:scaleX(0);opacity:0}5%{opacity:1}9%{transform:scaleX(1);opacity:1}16%,100%{transform:scaleX(1);opacity:0}}
  .head{animation:fade 1s ease both}
  .pill{transform-origin:center;animation:pop .7s cubic-bezier(.2,.7,.2,1) both}
  .box{stroke-width:1.3;animation:scan 8s ease-in-out infinite}
  .badge{animation:scanBadge 8s ease-in-out infinite}
  .ul{opacity:0;transform-origin:0 50%;}animation:underline 8s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="3" y="3" width="1194" height="162" rx="18" fill="url(#bg)" stroke="#344d56" stroke-width="1.5"/>
<g class="f head">
  <text x="32" y="42" fill="#e7f0ed" font-size="20" font-weight="700" letter-spacing="1.8">TECNOLOGIAS</text>
  <text x="1168" y="41" text-anchor="end" fill="#83a2a5" font-size="12" letter-spacing="1.3">FERRAMENTAS DO ECOSSISTEMA</text>
</g>
<g class="f">
  <g class="pill fb" style="animation-delay:.2s"><rect class="box" fill="#1d303a" stroke="#3a5660" style="animation-delay:.5s" x="32" y="66" width="152" height="68" rx="12"/><rect class="badge" fill-opacity=".12" style="animation-delay:.5s" x="48" y="86" width="28" height="28" rx="8" fill="#6ee7c8"/><text x="62" y="105" text-anchor="middle" fill="#6ee7c8" font-size="13" font-weight="700">JS</text><text x="86" y="105" fill="#e0ebe7" font-size="15" font-weight="600">JavaScript</text><rect class="ul fb" style="animation-delay:.5s" x="48" y="127" width="120" height="2" rx="1" fill="url(#line)"/></g>
  <g class="pill fb" style="animation-delay:.3s"><rect class="box" fill="#1d303a" stroke="#3a5660" style="animation-delay:1.5s" x="196" y="66" width="152" height="68" rx="12"/><rect class="badge" fill-opacity=".12" style="animation-delay:1.5s" x="212" y="86" width="28" height="28" rx="8" fill="#6ee7c8"/><text x="226" y="105" text-anchor="middle" fill="#6ee7c8" font-size="13" font-weight="700">5</text><text x="250" y="105" fill="#e0ebe7" font-size="15" font-weight="600">HTML</text><rect class="ul fb" style="animation-delay:1.5s" x="212" y="127" width="120" height="2" rx="1" fill="url(#line)"/></g>
  <g class="pill fb" style="animation-delay:.4s"><rect class="box" fill="#1d303a" stroke="#3a5660" style="animation-delay:2.5s" x="360" y="66" width="152" height="68" rx="12"/><rect class="badge" fill-opacity=".12" style="animation-delay:2.5s" x="376" y="86" width="28" height="28" rx="8" fill="#6ee7c8"/><text x="390" y="105" text-anchor="middle" fill="#6ee7c8" font-size="13" font-weight="700">#</text><text x="414" y="105" fill="#e0ebe7" font-size="15" font-weight="600">CSS</text><rect class="ul fb" style="animation-delay:2.5s" x="376" y="127" width="120" height="2" rx="1" fill="url(#line)"/></g>
  <g class="pill fb" style="animation-delay:.5s"><rect class="box" fill="#1d303a" stroke="#3a5660" style="animation-delay:3.5s" x="524" y="66" width="152" height="68" rx="12"/><rect class="badge" fill-opacity=".12" style="animation-delay:3.5s" x="540" y="86" width="28" height="28" rx="8" fill="#6ee7c8"/><text x="554" y="105" text-anchor="middle" fill="#6ee7c8" font-size="13" font-weight="700">NG</text><text x="578" y="105" fill="#e0ebe7" font-size="15" font-weight="600">Angular</text><rect class="ul fb" style="animation-delay:3.5s" x="540" y="127" width="120" height="2" rx="1" fill="url(#line)"/></g>
  <g class="pill fb" style="animation-delay:.6s"><rect class="box" fill="#1d303a" stroke="#3a5660" style="animation-delay:4.5s" x="688" y="66" width="152" height="68" rx="12"/><rect class="badge" fill-opacity=".12" style="animation-delay:4.5s" x="704" y="86" width="28" height="28" rx="8" fill="#6ee7c8"/><text x="718" y="105" text-anchor="middle" fill="#6ee7c8" font-size="13" font-weight="700">N</text><text x="742" y="105" fill="#e0ebe7" font-size="15" font-weight="600">Node.js</text><rect class="ul fb" style="animation-delay:4.5s" x="704" y="127" width="120" height="2" rx="1" fill="url(#line)"/></g>
  <g class="pill fb" style="animation-delay:.7s"><rect class="box" fill="#1d303a" stroke="#3a5660" style="animation-delay:5.5s" x="852" y="66" width="152" height="68" rx="12"/><rect class="badge" fill-opacity=".12" style="animation-delay:5.5s" x="868" y="86" width="28" height="28" rx="8" fill="#6ee7c8"/><text x="882" y="105" text-anchor="middle" fill="#6ee7c8" font-size="13" font-weight="700">EX</text><text x="906" y="105" fill="#e0ebe7" font-size="15" font-weight="600">Express</text><rect class="ul fb" style="animation-delay:5.5s" x="868" y="127" width="120" height="2" rx="1" fill="url(#line)"/></g>
  <g class="pill fb" style="animation-delay:.8s"><rect class="box" fill="#1d303a" stroke="#3a5660" style="animation-delay:6.5s" x="1016" y="66" width="152" height="68" rx="12"/><rect class="badge" fill-opacity=".12" style="animation-delay:6.5s" x="1032" y="86" width="28" height="28" rx="8" fill="#6ee7c8"/><text x="1046" y="105" text-anchor="middle" fill="#6ee7c8" font-size="13" font-weight="700">DB</text><text x="1070" y="105" fill="#e0ebe7" font-size="15" font-weight="600">PostgreSQL</text><rect class="ul fb" style="animation-delay:6.5s" x="1032" y="127" width="120" height="2" rx="1" fill="url(#line)"/></g>
</g>
</svg>
